<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>مغامرة الفضاء والكواكب | عالم فن كيدز</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/games.css" />
  <link rel="stylesheet" href="../css/animations.css" />
</head>
<body data-standalone-game="space" class="selection:bg-amber-300 selection:text-slate-900">
  <div id="confetti-layer" class="fixed inset-0 pointer-events-none z-50"></div>

  <div id="celebration-toast" class="hidden fixed bottom-4 left-3 right-3 sm:left-auto sm:right-6 sm:w-[400px] z-50 bg-gradient-to-r from-amber-400 via-yellow-300 to-orange-400 p-3.5 rounded-3xl border-4 border-white shadow-2xl items-center gap-3">
    <div class="text-3xl bg-white p-2 rounded-2xl shadow shrink-0">🏆</div>
    <div class="flex-1 min-w-0">
      <h4 id="celebration-title" class="font-black text-slate-900 text-sm sm:text-base truncate">إنجاز رائع!</h4>
      <p id="celebration-details" class="font-extrabold text-slate-800 text-xs mt-0.5">+30 نقطة 🌟</p>
    </div>
  </div>

  <header class="max-w-6xl mx-auto px-3 sm:px-4 pt-3">
    <div class="card-3d p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="../index.html" class="btn-3d btn-primary text-xs py-2 px-3.5">🏠 الرئيسية</a>
        <div>
          <h1 class="text-base sm:text-xl font-black text-slate-900">🚀 مغامرة الفضاء والكواكب</h1>
          <p class="text-xs font-bold text-slate-500">جزيرة المعرفة - مشتركة للجميع</p>
        </div>
      </div>
      <div class="flex items-center gap-3 bg-sky-50 px-3.5 py-1.5 rounded-2xl border-2 border-sky-200 font-black text-xs sm:text-sm">
        <span class="text-rose-600">النقاط: <span class="ui-points">150</span> 💎</span>
        <span class="text-amber-500">النجوم: <span class="ui-stars">15</span> ⭐</span>
        <span class="text-emerald-600">مستوى <span class="ui-level">2</span></span>
      </div>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-3 sm:px-4 mt-2.5">
    <div class="card-3d p-3.5 bg-amber-50/90 flex flex-col sm:flex-row items-center gap-3">
      <div class="relative shrink-0 max-avatar-wrap">
        <img src="../assets/characters/max-avatar.jpg" alt="المرشد ماكس" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full border-4 border-amber-400 object-cover" />
      </div>
      <div class="flex-1 text-center sm:text-right">
        <div class="text-xs font-black text-amber-900 mb-1">المرشد الكرتوني ماكس (<span class="max-mood-badge">🦊✨ سعيد</span>):</div>
        <p class="max-speech-text font-extrabold text-slate-800 text-xs sm:text-sm">مرحباً بك في مغامرة الفضاء والكواكب! هيا نلعب ونحقق أعلى النقاط!</p>
      </div>
      <button type="button" onclick="window.MaxCompanion.nextTip()" class="btn-3d btn-accent text-xs py-2 px-4">💡 نصيحة</button>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-4">
    <div class="card-3d p-4 sm:p-6 bg-white/95">
      <div id="math-game-mount" class="hidden"></div>
      <div id="memory-game-mount" class="hidden"></div>
      <div id="animals-game-mount" class="hidden"></div>
      <div id="puzzle-game-mount" class="hidden"></div>
      <div id="drawing-game-mount" class="hidden"></div>
      <div id="space-game-mount" class=""></div>
      <div id="racer-game-mount" class="hidden"></div>
      <div id="robo-game-mount" class="hidden"></div>
      <div id="soccer-game-mount" class="hidden"></div>
      <div id="dino-game-mount" class="hidden"></div>
      <div id="archery-game-mount" class="hidden"></div>
      <div id="fashion-game-mount" class="hidden"></div>
      <div id="bakery-game-mount" class="hidden"></div>
      <div id="jewelry-game-mount" class="hidden"></div>
      <div id="petcare-game-mount" class="hidden"></div>
      <div id="garden-game-mount" class="hidden"></div>
    </div>
  </main>

  <footer class="max-w-6xl mx-auto px-3 sm:px-4 pb-6 text-center">
    <div class="card-3d p-4 bg-white/90">
      <span class="inline-block px-5 py-1.5 rounded-full bg-amber-200 border-2 border-amber-400 text-slate-900 font-black text-sm sm:text-base">
        حليمه فهمي الحارثي
      </span>
    </div>
  </footer>

  <script src="../js/storage.js"></script>
  <script src="../js/rewards.js"></script>
  <script src="../js/character.js"></script>
  <script src="../js/math-game.js"></script>
  <script src="../js/memory-game.js"></script>
  <script src="../js/puzzle-game.js"></script>
  <script src="../js/drawing-game.js"></script>
  <script src="../js/space-game.js"></script>
  <script src="../js/boys-games.js"></script>
  <script src="../js/girls-games.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
